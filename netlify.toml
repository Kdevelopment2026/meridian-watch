# The site is a static export, so Netlify only has to build it and serve
# the result. Nothing runs at request time.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # React Three Fiber declares optional Expo peers that npm otherwise
  # tries to resolve against React 19.
  NPM_FLAGS = "--legacy-peer-deps"
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Hashed build output never changes under the same name.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
