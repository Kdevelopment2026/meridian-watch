# The site is a static export, so Netlify only has to build it and serve
# the result. Nothing runs at request time.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # React Three Fiber declares optional Expo peers that npm otherwise
  # tries to resolve against React 19.
  NPM_FLAGS = "--legacy-peer-deps"
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Netlify sets this by default on *.netlify.app. Pinned here so it
    # survives a move to a custom domain.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # 'unsafe-inline' is unavoidable on a static export: there is no
    # server to mint a nonce, and the twelve inline scripts are React's
    # own flight payload. Everything else is locked to this origin.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'; object-src 'none'; upgrade-insecure-requests"

# Hashed build output never changes under the same name.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
